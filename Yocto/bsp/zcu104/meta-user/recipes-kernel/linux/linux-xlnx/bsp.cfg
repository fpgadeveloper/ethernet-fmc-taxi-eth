# Xilinx AXI DMA dmaengine driver: each Taxi RGMII MAC port is paired with an
# axi_dma_N core (MM2S = tx, S2MM = rx) that the taxi_mac driver drives through
# the dmaengine API. (The old CONFIG_XILINX_DMA_ENGINES menu symbol no longer
# exists in the 2025.2 kernel; CONFIG_XILINX_DMA is the AXI DMA driver.)
CONFIG_DMADEVICES=y
CONFIG_XILINX_DMA=y

# Ethernet FMC: Marvell 88E1510 PHYs on each Taxi port's MDIO bus.
CONFIG_NET_VENDOR_MARVELL=y
CONFIG_MVMDIO=y
CONFIG_MARVELL_PHY=y

# ZCU104 board RJ45 (PS GEM3): TI DP83867 PHY; AMD/Xilinx PHY drivers as in
# the other zcu104 reference BSPs.
CONFIG_DP83867_PHY=y
CONFIG_AMD_PHY=y
CONFIG_XILINX_PHY=y

# Kernel pktgen engine as a module - used by bench traffic tests
CONFIG_NET_PKTGEN=m
