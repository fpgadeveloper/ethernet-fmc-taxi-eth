# meta-taxi-eth: the board-independent part of the Ethernet FMC Taxi Ethernet
# Linux image, shared by every board bsp (listed in each
# bsp/<board>/bblayers-extra.txt, added to bblayers.conf by
# Yocto/scripts/configure-build.sh):
#   recipes-kernel/taxi-mac      the out-of-tree taxi_mac network driver, built
#                                from the repo's Linux/taxi-mac sources
#   recipes-apps/taxi-eth-test   the bench self-test script
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "taxi-eth"
BBFILE_PATTERN_taxi-eth = "^${LAYERDIR}/"
BBFILE_PRIORITY_taxi-eth = "8"
LAYERSERIES_COMPAT_taxi-eth = "scarthgap"

# This layer lives at <repo>/Yocto/common/meta-taxi-eth; the driver sources it
# builds live at <repo>/Linux (single source of truth - nothing is copied into
# the layer). Resolved once at parse time, normalised so bitbake's file
# checksums and FILESEXTRAPATHS see a clean absolute path.
TAXI_ETH_REPO_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', '..', '..'))}"
TAXI_ETH_LINUX_DIR := "${TAXI_ETH_REPO_DIR}/Linux"
